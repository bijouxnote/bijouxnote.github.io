<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bijoux Note</title>
<style>
  :root { --bg:#fbf7f1; --text:#4d382b; --muted:#8b7767; --line:#e9dfd6; --accent:#7a624f; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.85), transparent 34%),var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:min(100%, 820px); margin:0 auto; padding:64px 28px 48px; }
  .hero { text-align:center; padding:28px 0 74px; }
  .symbol { width:68px; height:68px; margin:0 auto 22px; object-fit:contain; display:block; opacity:.92; }
  .wordmark { width:min(430px, 78vw); max-height:135px; object-fit:contain; display:block; margin:0 auto; mix-blend-mode:multiply; }
  .concept { margin:22px 0 0; font-size:15px; letter-spacing:.045em; color:var(--muted); }
  .intro { width:min(100%, 560px); margin:28px auto 0; font-size:14px; line-height:2.05; color:#5b493e; }
  .ornament { width:56px; height:1px; background:var(--line); margin:38px auto 0; }
  .section-kicker { margin:0 0 14px; font-family:Georgia,"Times New Roman",serif; font-size:12px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; }
  .links { border-top:1px solid var(--line); }
  .item { display:flex; align-items:center; justify-content:space-between; gap:32px; padding:24px 4px 23px; text-decoration:none; color:inherit; border-bottom:1px solid var(--line); transition:opacity .2s ease; }
  .item:hover { opacity:.7; }
  .item-title { font-family:Georgia,"Times New Roman","Yu Mincho",serif; font-size:17px; margin-bottom:5px; }
  .item-desc { font-size:12px; color:var(--muted); }
  .arrow { font-family:Georgia,serif; font-size:22px; color:var(--accent); }
  .footer { text-align:center; padding:66px 0 22px; color:var(--muted); }
  .copyright { margin-top:18px; font-size:11px; letter-spacing:.04em; }
  @media (max-width:600px) { main { padding:42px 22px 38px; } .hero { padding:22px 0 58px; } .symbol { width:58px; height:58px; margin-bottom:18px; } .wordmark { width:min(400px, 84vw); } .concept { font-size:13px; } .intro { font-size:13px; line-height:1.95; } .item { padding:21px 0 20px; } .item-title { font-size:16px; } }
</style>
</head>
<body>
<main>
  <section class="hero">
    <img class="symbol" src="https://raw.githubusercontent.com/bijouxnote/bijouxnote.github.io/update-homepage-design/assets/bijouxnote-icon.png" alt="">
    <img class="wordmark" src="https://raw.githubusercontent.com/bijouxnote/bijouxnote.github.io/update-homepage-design/assets/bijouxnote-logo.png" alt="Bijoux Note">
    <p class="concept">コレクションも、欲しいものも、思い出も。</p>
    <p class="intro">大切なジュエリーの情報と、ひとつひとつにまつわる記録を<br>まとめて残せるジュエリー管理アプリです。</p>
    <div class="ornament"></div>
  </section>
  <section>
    <p class="section-kicker">Information</p>
    <div class="links">
      <a class="item" href="/support/"><div><div class="item-title">サポート</div><div class="item-desc">アプリの使い方・お問い合わせ</div></div><div class="arrow">→</div></a>
      <a class="item" href="/privacy/"><div><div class="item-title">プライバシーポリシー</div><div class="item-desc">データの取り扱いについて</div></div><div class="arrow">→</div></a>
      <a class="item" href="/commercial/"><div><div class="item-title">特定商取引法に基づく表記</div><div class="item-desc">Premiumプランの販売条件について</div></div><div class="arrow">→</div></a>
    </div>
  </section>
  <footer class="footer"><div class="copyright">© 2026 Bijoux Note</div></footer>
</main>
</body>
</html>
